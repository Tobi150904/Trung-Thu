    <!-- BẢN TĨNH (offline): mọi dữ liệu động của trang gốc đã được ghim sẵn
         vào data/access.json. Script dưới đây chặn mọi lời gọi API và trả về
         dữ liệu tĩnh đó, nên trang chạy hoàn toàn không cần backend.
         Mọi đường dẫn tài nguyên đều là tương đối nên đặt ở thư mục con
         hay tên miền nào cũng chạy. -->
    <script>
    (function () {
      // Thư mục chứa index.html (tính trước khi đổi đường dẫn)
      var BASE = location.pathname.replace(/[^/]*$/, "");
      var STATIC_DATA_URL = BASE + "data/access.json";

      // Bản tĩnh chỉ có một tấm thiệp: ghim sẵn mã thiệp,
      // không phụ thuộc vào đường dẫn nên đặt ở thư mục nào cũng chạy.
      window.__STATIC_SLUG = "minhchauiu";
      window.__BASE = BASE;

      var cached = null;
      var originalFetch = window.fetch.bind(window);

      function isApi(url) {
        try { url = String(url); } catch (e) { return false; }
        return url.indexOf("/api/") !== -1 || url.indexOf("access/by-slug") !== -1;
      }

      function loadStatic() {
        if (cached) return Promise.resolve(cached);
        return originalFetch(STATIC_DATA_URL, { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (json) { cached = json; return json; });
      }

      window.fetch = function (input, init) {
        var url = (input && input.url) ? input.url : input;
        if (isApi(url)) {
          return loadStatic().then(function (json) {
            return new Response(JSON.stringify(json), {
              status: 200,
              headers: { "Content-Type": "application/json" }
            });
          });
        }
        return originalFetch(input, init);
      };

      var open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        if (isApi(url)) {
          arguments[1] = STATIC_DATA_URL;
          arguments[0] = "GET";
        }
        return open.apply(this, arguments);
      };

      // Lưới an toàn: nếu còn sót đường dẫn tuyệt đối (/assets, /media, /font)
      // thì tự đổi về thư mục hiện tại.
      function fix(u) {
        if (typeof u === "string" && /^\/(assets|media|font|data)\//.test(u)) {
          return BASE + u.slice(1);
        }
        return u;
      }
      [
        [HTMLImageElement, "src"],
        [HTMLMediaElement, "src"],
        [HTMLSourceElement, "src"]
      ].forEach(function (pair) {
        var proto = pair[0] && pair[0].prototype;
        if (!proto) return;
        var d = Object.getOwnPropertyDescriptor(proto, pair[1]);
        if (!d || !d.set) return;
        Object.defineProperty(proto, pair[1], {
          configurable: true,
          enumerable: d.enumerable,
          get: d.get,
          set: function (v) { d.set.call(this, fix(v)); }
        });
      });
      var setAttr = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function (name, value) {
        if (name === "src" || name === "href") value = fix(value);
        return setAttr.call(this, name, value);
      };
    })();
    </script>
