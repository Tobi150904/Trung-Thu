<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Thiệp Trung Thu</title>
<style>
  html,body{margin:0;height:100%;background:#050a14;overflow:hidden}
  #stage{position:fixed;inset:0;perspective:1200px;perspective-origin:50% 40%}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#050a14;transform-style:preserve-3d;will-change:transform,opacity,filter}
  #s2{z-index:0;opacity:1;pointer-events:none}
  #s1{z-index:1;background:transparent}
  #shield{position:fixed;inset:0;z-index:5;display:none}
  #rabbit{position:fixed;z-index:6;pointer-events:none;opacity:0;left:0;top:0;transform-origin:50% 100%;will-change:transform}
</style>
</head>
<body>
<div id="stage"><iframe id="s2" src="s2/index.html" allow="autoplay"></iframe><iframe id="s1" src="s1/index.html" allow="autoplay"></iframe></div>
<div id="shield"></div>
<img id="rabbit" src="s1/images/bears/tho.webp" alt="" />
<script>
(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = (ms) => RM ? Math.max(120, ms * 0.25) : ms;
  const stage = document.getElementById('stage');
  const s1 = document.getElementById('s1');
  const s2 = document.getElementById('s2');
  const shield = document.getElementById('shield');
  const rabbit = document.getElementById('rabbit');
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  let started = false;
  let sceneReady;

  function fadeAudio(a, to, ms) {
    if (!a) return;
    const from = a.volume, t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      a.volume = from + (to - from) * k;
      if (k < 1) requestAnimationFrame(step); else if (to === 0) a.pause();
    };
    requestAnimationFrame(step);
  }

  function findImg(doc, name) {
    return [...doc.querySelectorAll('image,img')].find(el =>
      (el.getAttribute('href') || el.getAttribute('xlink:href') || el.getAttribute('src') || '').includes(name));
  }
  function findHint(doc) {
    return [...doc.querySelectorAll('body *')].find(el =>
      el.children.length === 0 && /Ấn giữ vào mặt trăng/.test(el.textContent || ''));
  }
  function layer(doc, name) {
    const image = findImg(doc, name);
    return image && image.closest('g');
  }
  function moveToX(el, ratio) {
    if (!el) return;
    const r = el.getBoundingClientRect();
    const dx = innerWidth * ratio - (r.left + r.width / 2);
    el.style.translate = `${dx}px 0`;
  }
  function makeSourceOneTransparent() {
    const doc = s1.contentDocument;
    if (!doc || doc.getElementById('merged-scene-overrides')) return;
    const css = doc.createElement('style');
    css.id = 'merged-scene-overrides';
    css.textContent = `
      html,body,main{background:transparent!important}
      main>div.absolute.inset-0:first-of-type{background:transparent!important}
      [style*="rgb(58, 30, 39)"]{background:transparent!important}
    `;
    doc.head.appendChild(css);
    [...doc.querySelectorAll('.absolute.inset-0')].forEach(el => {
      if (getComputedStyle(el).backgroundImage.includes('rgb(58, 30, 39)')) {
        el.style.setProperty('background', 'transparent', 'important');
      }
    });
  }
  async function prepareSourceTwo() {
    if (!s2.contentDocument || !findImg(s2.contentDocument, '02-full-moon')) {
      await new Promise(r => s2.addEventListener('load', r, { once: true }));
    }
    const doc = s2.contentDocument;
    const moon = await waitFor(() => findImg(doc, '02-full-moon'));
    const preludeCss = doc.createElement('style');
    preludeCss.id = 'merged-prelude-css';
    preludeCss.textContent = `body.merged-prelude #g-stars,body.merged-prelude #g-mountains,
      body.merged-prelude #g-lantern-distant,body.merged-prelude #g-lantern-small-right,
      body.merged-prelude #g-lantern-medium-center,body.merged-prelude #g-window-frame,
      body.merged-prelude #g-lantern-large-over-frame,body.merged-prelude #g-cloud-left,
      body.merged-prelude #g-cloud-right,body.merged-prelude #g-osmanthus-branch,
      body.merged-prelude #g-jade-rabbit,body.merged-prelude #g-single-petal-template,
      body.merged-prelude [id*="petal"],body.merged-prelude [id*="flower"]{opacity:0!important;visibility:hidden!important}`;
    doc.head.appendChild(preludeCss);
    doc.body.classList.add('merged-prelude');
    const names = ['03-stars','04-mountains','05-window-frame','06-lantern-distant','07-lantern-small-right','08-lantern-medium-center','08-lantern-medium','09-lantern-large-over-frame','14-cloud-left','15-cloud-right','10-cloud-left-desktop','11-cloud-right-desktop','10-branch-first-batch','12-branch-desktop','12-single-petal'];
    const groups = [...new Set(names.flatMap(name => [...doc.querySelectorAll('image')].filter(x => (x.getAttribute('href') || '').includes(name)).map(x => x.closest('g'))).filter(Boolean))];
    const sky = layer(doc, '01-night-sky'); if (sky) groups.unshift(sky);
    const rabbitLayer = layer(doc, 'tho.webp');
    const bigLantern = doc.getElementById('g-lantern-large-over-frame');
    const moonGroup = moon && moon.closest('g');
    if (rabbitLayer) rabbitLayer.style.opacity = '0';
    groups.forEach(g => { g.style.opacity = '0'; g.style.visibility = 'hidden'; });
    // Keep Source 2's background and moon visible from the very first scene.
    if (moonGroup) { moonGroup.style.opacity = '1'; moonGroup.style.visibility = 'visible'; moveToX(moonGroup, .73); }
    if (bigLantern) moveToX(bigLantern, .24);
    const hint = findHint(doc); if (hint) hint.style.opacity = '0';
    return { doc, moon, moonGroup, rabbitLayer, bigLantern, groups, hint };
  }
  s1.addEventListener('load', () => { makeSourceOneTransparent(); setInterval(makeSourceOneTransparent, 250); });
  sceneReady = prepareSourceTwo();
  async function waitFor(fn, ms = 8000) {
    const t0 = performance.now();
    while (performance.now() - t0 < ms) { const v = fn(); if (v) return v; await wait(60); }
    return null;
  }

  async function handoff() {
    if (started) return; started = true;
    shield.style.display = 'block';
    try { fadeAudio(s1.contentWindow.__s1Audio, 0, 900); } catch (e) {}

    const { doc, rabbitLayer, moon, groups } = await sceneReady;
    const hideHint = () => { const h = findHint(doc); if (h) { h.style.transition = 'opacity .6s'; h.style.opacity = '0'; } return h; };
    let hint = hideHint();
    const hintTimer = setInterval(() => { hint = hint || hideHint(); }, 100);
    await wait(T(500));

    // 1) The lantern, flowers and bear finish shrinking into the persistent moon.
    const mDur = T(900);
    s1.animate([
      { opacity: 1, transform: 'translateZ(0) rotateX(0) scale(1)', filter: 'blur(0)' },
      { opacity: 0, transform: 'translateZ(-260px) rotateX(10deg) scale(.08)', filter: 'blur(6px)' }
    ], { duration: mDur, easing: 'cubic-bezier(.6,0,.3,1)', fill: 'forwards' });
    await wait(mDur);
    s1.remove();

    // 2) Morph every Source 2 layer in sequence, excluding the moon and rabbit.
    const directions = [
      [-innerWidth*.18, 0], [0, -innerHeight*.16], [innerWidth*.2, 0],
      [0, innerHeight*.16], [-innerWidth*.18, -innerHeight*.08],
      [innerWidth*.2, -innerHeight*.08], [-innerWidth*.2, innerHeight*.1],
      [innerWidth*.2, innerHeight*.1]
    ];
    doc.body.classList.remove('merged-prelude');
    const morphs = groups.map((g, i) => {
      const [x,y] = directions[i % directions.length];
      g.style.visibility = 'visible';
      return g.animate([
        { opacity: 0, transform: `translate(${x}px,${y}px) scale(.72)`, filter: 'blur(7px)' },
        { opacity: 1, transform: 'translate(0,0) scale(1)', filter: 'blur(0)' }
      ], { duration: T(1050), delay: T(i * 145), easing: 'cubic-bezier(.2,.75,.2,1)', fill: 'forwards' });
    });
    await Promise.all(morphs.map(a => a.finished));

    // 3) Source 1 rabbit lands on the source 2 branch (curved flight).
    if (rabbitLayer) {
      const b = rabbitLayer.getBoundingClientRect();
      rabbit.style.width = b.width + 'px'; rabbit.style.height = b.height + 'px';
      const sx = innerWidth * 0.98 - b.left, sy = -b.height * 1.5 - b.top;
      rabbit.style.left = b.left + 'px'; rabbit.style.top = b.top + 'px';
      const pts = [];
      for (let i = 0; i <= 20; i++) {
        const k = i / 20, e = 1 - Math.pow(1 - k, 3);
        const x = sx * (1 - e);
        const y = sy * (1 - e) - Math.sin(Math.PI * k) * innerHeight * 0.12;
        const land = k > .9 ? 1 - (k - .9) * 10 * 0.08 : 1;
        pts.push({ transform: `translate(${x}px,${y}px) rotate(${(1 - k) * -25}deg) scale(${(0.6 + 0.4 * e) * land},${(0.6 + 0.4 * e) / land})`, opacity: Math.min(1, k * 4) });
      }
      pts.push({ transform: 'translate(0,0) rotate(0) scale(1)', opacity: 1 });
      await rabbit.animate(pts, { duration: T(1800), easing: 'linear', fill: 'forwards' }).finished;
      rabbitLayer.style.opacity = '1';
      rabbit.style.display = 'none';
    }

    // 4) Show the hint and hand control to source 2.
    clearInterval(hintTimer);
    hint = hint || findHint(doc);
    if (hint) hint.style.opacity = '';
    s2.style.pointerEvents = 'auto';
    shield.style.display = 'none';
    s2.focus();
  }

  addEventListener('message', (e) => { if (e.data === 's1-done') handoff(); });
})();
</script>
</body>
</html>
